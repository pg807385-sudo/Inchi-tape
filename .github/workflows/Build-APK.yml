name: Build AR Measure APK

# Put ARMeasure.zip in the root of your repo, then push.
# This workflow unzips it and builds a debug APK.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o ARMeasure.zip -d .
          ls -la ARMeasure

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper (project has none checked in)
        run: |
          cd ARMeasure
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build debug APK
        run: |
          cd ARMeasure
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ar-measure-debug-apk
          path: ARMeasure/app/build/outputs/apk/debug/app-debug.apk
