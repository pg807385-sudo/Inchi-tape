name: Unzip Project and Push

on:
  push:
    paths:
      - 'SmartMeasure.zip'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  unzip-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wipe old project files (keep .git, .github, and the new zip)
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'SmartMeasure.zip' \
            -exec rm -rf {} +

      - name: Unzip into a clean temp dir
        run: |
          rm -rf /tmp/extracted
          mkdir -p /tmp/extracted
          unzip -o SmartMeasure.zip -d /tmp/extracted

      - name: Move contents directly to repo root
        run: |
          if [ -d /tmp/extracted/SmartMeasure ] && [ "$(ls /tmp/extracted | wc -l)" -eq 1 ]; then
            SRC=/tmp/extracted/SmartMeasure
          else
            SRC=/tmp/extracted
          fi
          shopt -s dotglob
          mv "$SRC"/* .
          ls -la

      - name: Delete the zip file from the repo
        run: rm -f SmartMeasure.zip

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Replace ARCore project with non-AR Smart Measure app"
            git push
          fi
