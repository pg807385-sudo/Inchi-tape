name: Create and Upload Zip Artifact

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Zip Repository Files
        run: |
          zip -r project.zip . -x "*.git*"

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inchi-tape-project
          path: project.zip
          retention-days: 7
          
