name: Unzip Project and Push

on:
  push:
    paths:
      - 'ARMeasure.zip'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  unzip-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove any old extracted folder
        run: rm -rf ARMeasure

      - name: Unzip into a clean temp dir
        run: |
          rm -rf /tmp/extracted
          mkdir -p /tmp/extracted
          unzip -o ARMeasure.zip -d /tmp/extracted

      - name: Place extracted project at repo root as ARMeasure/
        run: |
          if [ -d /tmp/extracted/ARMeasure ] && [ "$(ls /tmp/extracted | wc -l)" -eq 1 ]; then
            mv /tmp/extracted/ARMeasure ./ARMeasure
          else
            mv /tmp/extracted ./ARMeasure
          fi
          ls -la ARMeasure

      - name: Delete the zip file from the repo
        run: rm -f ARMeasure.zip

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Unzip ARMeasure.zip into ARMeasure/ and remove the zip"
            git push
          fi
