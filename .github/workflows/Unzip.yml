name: Unzip Project and Push

on:
  push:
    paths:
      - 'ARMeasure.zip'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  unzip-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove any old extracted folder (flatten previous run too)
        run: rm -rf ARMeasure

      - name: Unzip into a clean temp dir
        run: |
          rm -rf /tmp/extracted
          mkdir -p /tmp/extracted
          unzip -o ARMeasure.zip -d /tmp/extracted

      - name: Move contents directly to repo root
        run: |
          # If the zip has a single top-level "ARMeasure" folder, reach inside it
          # and move its contents to repo root — no wrapper folder.
          if [ -d /tmp/extracted/ARMeasure ] && [ "$(ls /tmp/extracted | wc -l)" -eq 1 ]; then
            SRC=/tmp/extracted/ARMeasure
          else
            SRC=/tmp/extracted
          fi
          shopt -s dotglob
          mv "$SRC"/* .
          ls -la

      - name: Delete the zip file from the repo
        run: rm -f ARMeasure.zip

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Flatten project to repo root and remove zip"
            git push
          fi
